name: Tests

# Every phone downloads data/jagttider.json from main within minutes of a push.
# The tests read that file, so a broken season or place fails here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: swift test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Core tests
        run: |
          swift --version
          swift test
